
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ChatCards Preview Test</title>
  <meta name="description" content="Testing hosted Discord card previews for ChatCards.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="ChatCards — Preview Test">
  <meta property="og:description" content="A hosted card preview experiment. No bot required for this basic link preview.">
  <meta property="og:url" content="https://YOUR-USERNAME.github.io/chatcards/">
  <meta name="theme-color" content="#5865f2">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0f0f0f;
      color: #f1f1f1;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(100%, 520px);
      padding: 28px;
      border: 1px solid #353535;
      border-radius: 18px;
      background: #212121;
    }

    .label {
      color: #a5b4fc;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    h1 { margin-bottom: 10px; }

    p {
      color: #bdbdbd;
      line-height: 1.6;
    }

    .status {
      margin-top: 24px;
      padding: 14px;
      border-radius: 10px;
      background: #303030;
    }

    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 8px;
      border-radius: 50%;
      background: #57f287;
    }
  </style>
</head>
<body>
  <main>
    <div class="label">CHATCARDS LAB</div>
    <h1>Discord Preview Test</h1>
    <p>
      This page tests whether Discord can display a custom title
      and description when someone shares a ChatCards link.
    </p>
    <div class="status">
      <span class="dot"></span>
      Test page loaded successfully
    </div>
  </main>
</body>
</html>
